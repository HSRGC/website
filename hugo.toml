baseURL = 'https://www.hsrgc.gr/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Hellenic Society of Relativity, Gravitation and Cosmology'
theme = 'hsrgc'

MetaDataFormat = "yaml"
site_logo = "/images/hsrgc_logo.svg"
timeZone = 'Europe/Athens'
date_format = "02 Jan 2026"

[params]
cover_dimming_class = "bg-black-50"
favicon = "images/favicon.ico"
# custom_css = [""]
# choose a background color from any on this page: http://tachyons.io/docs/themes/skins/ and preface it with "bg-"
# background_color_class = "bg-near-black"
background_color_class = "bg-dark-green"
header_section_class = "tc-l pv4 pv6-l ph3 ph4-ns"
featured_image = "images/headerphoto_cover.jpg"
featured_image_class = "cover bg-center"
recent_posts_number = 10

[taxonomies]
tag = "tags"
category = "categories"
member-tag = "member-tags"

[Social]
    twitter = "https://twitter.com/hsrgc"
    facebook = "@hsrgc"
    instagram = ""
    youtube = "@hsrgc1231231"
    linkedin = ""
    mastodon = ""
    slack = ""
    rss = ""

[outputs]
  home = ['HTML', 'RSS']

[languages]
  [languages.en]
    locale = 'en'
    label = 'English'
    weight       = 1
    title        = 'Hellenic Society of Relativity, Gravitation and Cosmology'
    [languages.en.params]
      description = 'Hellenic Society of Relativity, Gravitation and Cosmology'

  [languages.el]
    locale = 'el'
    label = 'Ελληνικά'
    weight       = 2
    title        = 'Ελληνική Εταιρεία Σχετικότητας, Βαρύτητας και Κοσμολογίας'
    [languages.el.params]
      description = 'Ελληνική Εταιρεία Σχετικότητας, Βαρύτητας και Κοσμολογίας'


